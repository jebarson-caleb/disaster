name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pip check
      - run: ruff check .
        working-directory: backend
      - run: pip-audit -r requirements-dev.txt
        working-directory: backend
      - run: flask --app run:app db upgrade
        working-directory: backend
      - run: flask --app run:app db check
        working-directory: backend
      - run: pytest -q -W error --cov=app --cov-report=term-missing --cov-fail-under=75
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  role-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Exercise every role demo and the public sign-in screen
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/resq-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 npm run test:e2e -- e2e/demo-roles.spec.js e2e/production-auth.spec.js --project=chromium

  account-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Exercise direct real-account login for every role
        shell: bash
        env:
          APP_ENV: testing
          AUTO_MIGRATE: 'true'
          CORS_ORIGINS: http://127.0.0.1:5173
          DATABASE_URL: sqlite:////tmp/resq-account-acceptance.sqlite
          DEMO_MODE: 'false'
          JWT_SECRET_KEY: account-acceptance-jwt-secret-key-32-characters
          RATELIMIT_ENABLED: 'false'
          SECRET_KEY: account-acceptance-app-secret-key-32-characters
          VITE_API_BASE_URL: http://127.0.0.1:5000/api/v1
        run: |
          set -euo pipefail
          (
            cd backend
            python -m scripts.seed_account_acceptance
          )
          python backend/run.py > "$RUNNER_TEMP/resq-account-backend.log" 2>&1 &
          backend_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/resq-account-frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" "$backend_pid" 2>/dev/null || true' EXIT

          backend_ready=false
          frontend_ready=false
          for _ in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health > /dev/null; then
              backend_ready=true
            fi
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              frontend_ready=true
            fi
            if [[ "$backend_ready" == true && "$frontend_ready" == true ]]; then
              break
            fi
            sleep 1
          done

          if [[ "$backend_ready" != true || "$frontend_ready" != true ]]; then
            cat "$RUNNER_TEMP/resq-account-backend.log"
            cat "$RUNNER_TEMP/resq-account-frontend.log"
            exit 1
          fi

          cd frontend
          REAL_ACCOUNT_E2E=true BASE_URL=http://127.0.0.1:5173 npm run test:e2e -- e2e/real-account-roles.spec.js --project=chromium
      - name: Preserve isolated account acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-browser-diagnostics
          retention-days: 3
          path: |
            frontend/test-results/
            ${{ runner.temp }}/resq-account-backend.log
            ${{ runner.temp }}/resq-account-frontend.log
