name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
      url: https://disaster-delta-eight.vercel.app
    env:
      BASE_URL: https://disaster-delta-eight.vercel.app
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for this commit's Vercel deployment
        shell: bash
        run: |
          set -euo pipefail

          vercel_state="pending"
          for attempt in $(seq 1 30); do
            vercel_state="$(
              curl --silent --show-error --fail --location \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
                | jq -r '[.statuses[] | select(.context | startswith("Vercel"))][0].state // "pending"'
            )"
            echo "Vercel status for $GITHUB_SHA: $vercel_state (attempt $attempt/30)"
            if test "$vercel_state" = "success"; then
              break
            fi
            if test "$vercel_state" = "failure" || test "$vercel_state" = "error"; then
              exit 1
            fi
            sleep 10
          done
          test "$vercel_state" = "success"

      - name: Probe live application
        shell: bash
        run: |
          set -euo pipefail

          curl_args=(
            --silent
            --show-error
            --fail
            --location
            --retry 12
            --retry-all-errors
            --retry-delay 15
            --connect-timeout 10
            --max-time 45
          )

          curl "${curl_args[@]}" "$BASE_URL/" \
            --dump-header root.headers \
            --output root.html
          grep -q 'id="root"' root.html
          main_asset="$(
            grep -oE 'src="/assets/[^"]+\.js"' root.html \
              | head -n 1 \
              | cut -d '"' -f 2
          )"
          test -n "$main_asset"
          curl "${curl_args[@]}" "$BASE_URL$main_asset" --output client.js
          if grep -Eiq 'DemoPassword123|admin@rescue\.local|Velachery Govt|Meena Kumar|Rajiv Gandhi Govt' client.js; then
            echo "Known demo credentials or records were found in the production client bundle."
            exit 1
          fi

          curl "${curl_args[@]}" "$BASE_URL/api/v1/health" \
            --dump-header health.headers \
            --output health.json
          curl "${curl_args[@]}" "$BASE_URL/api/v1/ready" \
            --dump-header ready.headers \
            --output ready.json
          curl "${curl_args[@]}" "$BASE_URL/api/v1/national-alerts" \
            --dump-header public.headers \
            --output public.json

          auth_status="$(
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              --output auth.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/v1/auth/me"
          )"
          test "$auth_status" = "401"

          demo_status="$(
            curl --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"role":"Admin"}' \
              --output demo.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/v1/auth/demo-session"
          )"
          test "$demo_status" = "404"

          malformed_status="$(
            curl --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '["invalid-login-shape"]' \
              --output malformed.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/v1/auth/login"
          )"
          test "$malformed_status" = "400"

          privileged_registration_status="$(
            curl --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"name":"Smoke Probe","email":"smoke-probe@example.invalid","phone":"0000000000","role":"Admin","password":"NonPersistent-Smoke-Password-91"}' \
              --output privileged-registration.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/v1/auth/register"
          )"
          test "$privileged_registration_status" = "403"

          recovery_status="$(
            curl --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"email":"nobody@example.invalid"}' \
              --output recovery.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/v1/auth/password-reset/request"
          )"
          test "$recovery_status" = "202"

      - name: Validate responses and security headers
        shell: python {0}
        run: |
          import json
          from pathlib import Path

          health = json.loads(Path("health.json").read_text())
          readiness = json.loads(Path("ready.json").read_text())
          public_feed = json.loads(Path("public.json").read_text())
          recovery = json.loads(Path("recovery.json").read_text())

          assert health["status"] == "ok", health
          assert readiness["status"] == "ready", readiness
          assert readiness["checks"]["configuration"] is True, readiness
          assert readiness["checks"]["database"] is True, readiness
          assert public_feed["country"] == "India", public_feed
          assert isinstance(public_feed["alerts"], list), public_feed
          assert isinstance(public_feed["disasters"], list), public_feed
          assert isinstance(public_feed["news_updates"], list), public_feed
          assert recovery["message"], recovery
          assert isinstance(recovery["recovery_available"], bool), recovery

          headers = Path("ready.headers").read_text().lower()
          required_headers = {
              "cache-control": "no-store",
              "content-security-policy": "default-src 'self'",
              "strict-transport-security": "max-age=",
              "x-content-type-options": "nosniff",
              "x-frame-options": "deny",
              "x-request-id": "",
          }
          for name, value in required_headers.items():
              prefix = f"{name}:"
              matching = [line for line in headers.splitlines() if line.startswith(prefix)]
              assert matching, f"missing {name}"
              assert any(value in line for line in matching), f"unexpected {name}"

          print("Production root, readiness, auth/recovery boundaries, demo isolation, and headers are healthy.")
