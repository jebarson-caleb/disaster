name: Reset demo sandbox

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: demo-sandbox-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Rebuild the isolated demo database
        working-directory: backend
        env:
          APP_ENV: demo
          AUTO_MIGRATE: 'true'
          COOKIE_SECURE: 'true'
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DEMO_MODE: 'true'
          DEMO_DATABASE_NAME: ${{ vars.DEMO_DATABASE_NAME }}
          DEMO_RESET_CONFIRMATION: RESET_DEMO_DATABASE
          JWT_SECRET_KEY: ${{ secrets.DEMO_JWT_SECRET_KEY }}
          RATELIMIT_STORAGE_URI: ${{ secrets.DEMO_RATELIMIT_STORAGE_URI }}
          SECRET_KEY: ${{ secrets.DEMO_SECRET_KEY }}
        run: python -m scripts.reset_demo_database
